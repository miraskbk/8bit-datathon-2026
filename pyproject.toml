[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-violation-detector"
version = "0.1.0"
description = "Jury-ready API for classifying rule violations in MOV videos"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=16.0,<17",
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pillow>=10,<12",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "uvicorn[standard]>=0.30,<1",
  "opencv-python==5.0.0.93", "scikit-learn==1.9.1", "joblib==1.6.0", "timm==1.0.30", "transformers==5.20.1", "accelerate==1.15.0",
]

[project.optional-dependencies]
mlx = ["mlx-vlm==0.7.8", "mlx==0.32.4", "mlx-metal==0.32.4"]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
violation-api = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
