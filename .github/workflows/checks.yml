name: API and privacy checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest -q
      - run: node --check app/static/app.js
      - run: uv run --no-sync python -m tools.audit_release
      - run: cp .env.example .env
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check browser flow using synthetic responses
        run: |
          uv run --no-sync uvicorn app.main:app --host 127.0.0.1 --port 8005 --no-access-log > /tmp/8bit-ui-server.log 2>&1 &
          SERVICE_PID=$!
          trap 'kill "$SERVICE_PID"' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8005/health > /dev/null; then break; fi
            sleep 1
          done
          npm run test:ui
        env:
          API_KEY: ci-only-synthetic-browser-key-32-characters
          PRELOAD_MODEL: "false"
          JOB_DIR: runtime/browser-jobs
          UI_TEST_BASE: http://127.0.0.1:8005
      - run: docker compose config --quiet
        env:
          DEMO_DOMAIN: review.example.invalid
      - run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e DEMO_DOMAIN=review.example.invalid caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
